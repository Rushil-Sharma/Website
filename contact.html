<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Me</title>
    <link rel="stylesheet" href="CSS/contact.css">
</head>

<body>
    <header>

        <nav class="nav-bar" role="navigation" aria-label="Main Navigation">

            <div class="Rushils">Rushil's</div>
            <div class="website">website</div>

            <button class="nav-btn" onclick="goToHome()">Home</button>
            <button class="nav-btn" onclick="goToAbout()">About</button>
            <button class="nav-btn" onclick="goToProjects()">Projects</button>
            <button class="nav-btn" onclick="goToContact()">Contact</button>
            <label class="theme-toggle" aria-label="Toggle light and dark theme">
                <input type="checkbox" id="themeToggle" role="switch" aria-checked="false">
                <span class="slider"></span>
            </label>
        </nav>

    </header>

    <div class="heading">
        <p>Contact Me:-</p>
        <hr>
    </div>

    <div class="container" role="form" aria-labelledby="contact-heading">
        <div class="main_content">
            <p id="contact-heading">Name:</p>
            <input id="name" placeholder="Enter your name" aria-label="Enter your name">
            <p>Email:</p>
            <input id="email" placeholder="Enter your email" aria-label="Enter your email">
            <p>Message:</p>
            <textarea id="message" rows="4" cols="50" aria-label="Enter your message"></textarea>
        </div>
        <button id="submit" onclick="submit()">Submit</button>
    </div>

    <p id="status" aria-live="polite">Submit the message . . . </p>

    <footer>
        <a href="https://www.linkedin.com/in/rushil-sharma-b3107a361/">LinkedIN</a>
        <a href="https://github.com/Rushil-Sharma">Github</a>
        <a onclick="copy('Outlook')" role="button">Outlook</a>
        <a onclick="copy('Gmail')" role="button">Gmail</a>
    </footer>

    <script src="JS/contact.js"></script>
</body>

</html>
